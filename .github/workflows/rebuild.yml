# Weekly refresh of src/data/projects.cache.json from the live GitHub API.
#
# Runs ~15 min after craft-factory's Tuesday publish so any newly published /
# newly `portfolio`-tagged repo is picked up on the same day. Also runnable on
# demand via workflow_dispatch (used for the first populate — see docs/deploy.md).
#
# The refresh script (scripts/refresh-projects.mjs, ruling R23) writes a neutral
# snapshot only; if nothing changed, or the API errored, or no repo is tagged
# `portfolio`, the file is left untouched and this job is a no-op.
name: Refresh projects cache

on:
  schedule:
    - cron: '20 11 * * 2' # ~15 min after craft-factory's Tuesday run
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # DEPLOY_HOOK must be job-level, not step-level: a step's `if:` is evaluated
    # BEFORE that step's own `env:` block is applied, so a step-scoped var is
    # always empty in its own condition and the step would never run.
    env:
      DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The "Commit cache if changed" step below pushes straight to `main`.
          # `main` has branch protection with required status checks
          # (unit/e2e/quality/hygiene) and `enforce_admins: false`, so a repo
          # ADMIN bypasses those checks on a direct push — but the default
          # GITHUB_TOKEN pushes as `github-actions[bot]`, which is not an admin,
          # so its push is rejected ("N of N required status checks are
          # expected"). CACHE_PUSH_TOKEN is a fine-grained PAT on the Bilex95
          # account, scoped to this repo with Contents: read/write. Pushing with
          # it authenticates as Bilex95 (an admin), which clears the bypass.
          # A PAT push also triggers `ci.yml` on `main`, so the refresh commit is
          # still verified after the fact. See docs/deploy.md §4.
          token: ${{ secrets.CACHE_PUSH_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --import tsx scripts/refresh-projects.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit cache if changed
        run: |
          if ! git diff --quiet -- src/data/projects.cache.json; then
            git config user.name "tobi-dev-bot"
            git config user.email "actions@users.noreply.github.com"
            git add src/data/projects.cache.json
            git commit -m "chore: refresh projects cache"
            git push
          fi
      # No `|| echo` fallback: the `if` already covers the absent-secret case,
      # and swallowing curl's exit code would hide a real hook failure.
      - name: Trigger redeploy
        if: ${{ env.DEPLOY_HOOK != '' }}
        run: curl -fsS -X POST "$DEPLOY_HOOK"
