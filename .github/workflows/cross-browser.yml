# Nightly cross-browser smoke test.
#
# Runs the six FUNCTIONAL e2e specs (theme, gallery, home, case-study, about,
# blog) on Firefox + WebKit via `playwright.cross-browser.config.ts`.
#
# This is NOT a required check — it is informational. On failure it opens (or
# updates, if already open) a single tracking issue so a persistent regression
# stays visible without spamming a new issue every night.
name: Nightly cross-browser

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  xbrowser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps firefox webkit
      - run: npm run test:xbrowser

      - name: Open or update tracking issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'Nightly cross-browser smoke failing';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              'The nightly cross-browser smoke (`.github/workflows/cross-browser.yml`) failed.',
              '',
              `- Run: ${runUrl}`,
              `- Commit: ${context.sha}`,
              `- Workflow: ${context.workflow}`,
              `- Timestamp: ${new Date().toISOString()}`,
            ].join('\n');

            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cross-browser',
              per_page: 100,
            });
            const existing = open.data.find((issue) => issue.title === title);

            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cross-browser'],
              });
            }
